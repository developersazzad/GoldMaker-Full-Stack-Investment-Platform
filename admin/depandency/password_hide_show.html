<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title></title>
</head>

<body>
  <i onclick="myFunction_pass_eye('<?php echo $driver_data_need["id"] ?>')" class="fa fa-eye fa_eye" aria-hidden="true"></i>
  <input class="text-xs toggle_pass font-weight-bold" type="password" id="myInput_password_<?php echo $driver_data_need["id"] ?>" name="myInput_password" value="<?php echo $driver_data_need["password"] ?>">
  <!-- js -->
  <script type="text/javascript">
    // password show by click
    function myFunction_pass_eye(id) {
      var x = document.getElementById("myInput_password_" + id);
      if (x.type === "password") {
        x.type = "text";
      } else {
        x.type = "password";
      }
    }
    // password show by click
  </script>

</body>

</html>
